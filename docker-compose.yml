version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: salary_db
    restart: always
    environment:
      POSTGRES_USER: acme_admin
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: acme_salary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: salary_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: 
      context: ./backend
    container_name: salary_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://acme_admin:strongpassword123@db:5432/acme_salary_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: 
      context: ./backend
    container_name: salary_worker
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://acme_admin:strongpassword123@db:5432/acme_salary_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: salary_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
